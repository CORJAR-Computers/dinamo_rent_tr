[package]
name = "dinamo-rent"
version = "1.0.1"
description = "Dinamo Rent ERP — Tauri V2 + Rust + Firebird Embedded 5.0"
authors = ["Dinamo Rent a Car"]
edition = "2021"
default-run = "dinamo-rent"

[lib]
name = "dinamo_rent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dev_reset_admin"
path = "src/bin/dev_reset_admin.rs"
# El binario de reseteo de admin sólo se construye cuando se activa la
# feature `dev` (cargo build --features dev). Así no llega al bundle de
# release por defecto. El `main` además está detrás de `#[cfg(debug_assertions)]`
# como defense-in-depth.
required-features = ["dev"]

[[bin]]
name = "sync_dev"
path = "src/bin/sync_dev.rs"
# Sincronización SIMIT de punta a punta sobre la BD de desarrollo (sin Tauri,
# mismo camino que «Sincronizar ahora»). Solo se construye con `--features dev`
# para no llegar al bundle de release.
required-features = ["dev"]

[[bin]]
name = "rotate_pii_key"
path = "src/bin/rotate_pii_key.rs"
# Herramienta de mantenimiento (SECURITY.md §2.1): rota la clave PII
# re-cifrando las columnas de clientes. Sólo se construye con `--features dev`
# para no llegar al bundle de release.
required-features = ["dev"]

[[bin]]
name = "verificar_instalacion_limpia"
path = "src/bin/verificar_instalacion_limpia.rs"
# Validación E2E de instalación limpia (sin BD y sin el directorio de
# migraciones en disco): replica el arranque de producción sin Tauri. Sólo se
# construye con `--features dev` para no llegar al bundle de release.
required-features = ["dev"]

[features]
default = []
# Feature de desarrollo: habilita el binario `dev_reset_admin`.
dev = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Base de datos Firebird
rsfbclient = { version = "0.27", features = ["dynamic_loading"] }
r2d2 = "0.8"
r2d2_firebird = "0.27"
# tokio = { version = "1", features = ["full"] }  # TODO G-C3: sin uso actual (grep `tokio::` no encuentra referencias en src/). Reactivar si se añaden transacciones async, timers con tokio::time o spawn de tareas en background. Tauri v2 ya expone su propio runtime async.
rust_decimal = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Cliente HTTP del Agente SIMIT (captcha PoW + consulta de comparendos por placa)
# - `cookies`: habilita el jar de cookies persistente del agente. El gateway ADC
#   del SIMIT emite cookies de sesión (ADC_CONN_*/ADC_REQ_*) y rechaza con 401
#   "No se puede definir la política de seguridad" las peticiones sin ellas —
#   Fase 1 (ver Handsoff §3 y API-Runt-simit/service.py).
ureq = { version = "2.12", features = ["json", "cookies"] }
# Store de cookies de ureq (mismo crate que ureq usa internamente); lo
# declaramos directo para construir el jar explícitamente en services/simit.rs.
cookie_store = "0.21"

# Criptografía y seguridad
# - aes-gcm: cifrado PII nuevo formato `v1:` (AES-256-GCM) — ver core/crypto.rs
# - cbc + aes: solo para desencriptar tokens Fernet legacy (AES-128-CBC). NO quitar.
# - hmac: verificación HMAC-SHA256 de tokens Fernet legacy. NO quitar.
argon2 = "0.5"
pbkdf2 = { version = "0.12", features = ["sha2"] }
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
subtle = "2.5"

# Utilidades
once_cell = "1.19"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
# Permite tauri::test::mock_builder() para probar comandos con State<AppState> real
tauri = { version = "2", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
