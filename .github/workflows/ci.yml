name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pushes consecutivos a la misma rama: el run nuevo CANCELA el anterior
# (cancel-in-progress) para no gastar minutos en pipelines obsoletos.
# Consecuencia: en una cadena de pushes rápida, solo el tope de la rama
# queda con run completo; los commits intermedios aparecen como "cancelled".
# Para verificar el CI, revisar el run del HEAD (o el del pull_request), no
# el de commits intermedios. release.yml (por tag) no usa concurrency.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validación (lint + check + tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # jsdom 30 requiere Node >= 22.4; usamos Node 24 (LTS activo).
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Lint (eslint)
        run: bun run lint

      - name: Format check (prettier)
        run: bun run format:check

      - name: Svelte check
        run: bunx svelte-kit sync && bunx svelte-check --tsconfig ./tsconfig.json

      - name: Frontend tests (vitest)
        run: bunx vitest run

      - name: Build producción del frontend (vite build)
        run: bun run build

      # Unit tests de la lib Rust + formateo + clippy (no requieren BD).
      - name: Rust unit tests + check + clippy + fmt
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
          cargo check --all-targets

      # Tests de integración (src-tauri/tests/*.rs): se siembra una BD mínima
      # determinista con seed_ci (config → pool → migraciones → admin
      # Admin123! → 2 autos → 2 clientes) y se ejecutan completos, igual que
      # en desarrollo local. La BD va a src-tauri/../data (gitignored).
      - name: Rust tests de integración (seed_ci + ejecutar)
        working-directory: src-tauri
        run: |
          cargo run --features dev --bin seed_ci
          cargo test --tests

      # Los bins de mantenimiento (rotate_pii_key, sync_dev, dev_reset_admin)
      # usan required-features=["dev"] y quedan omitidos sin la feature:
      # comprobarlos aquí garantiza que el binario de rotación PII se chequea.
      - name: Rust check bins de mantenimiento (--features dev)
        working-directory: src-tauri
        run: cargo check --bins --features dev

      # Test del importador de datos (scripts/test_importar_autos_clientes.py):
      # unittest sin BD (parser puro). firebird-driver + cryptography solo se
      # instalan por el import del módulo (no abre BD). Python 3.12: desde
      # 3.11+ date.fromisoformat acepta formatos compactos (YYYYMMDD) — el
      # entorno donde aparece el bug del no_doc numérico que cubre el test.
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test importador de datos (python unittest)
        run: |
          python -m pip install --quiet firebird-driver cryptography
          python scripts/test_importar_autos_clientes.py

      # Test del verificador de paginación (orden 1 página Carta, contrato
      # 3-4 páginas con pie, informe A4) — usa Chrome/Edge headless, que viene
      # instalado en windows-latest. Valida además el fix del polling del PDF.
      - name: Test verificador de paginación (Chrome/Edge headless)
        run: node scripts/test-verificar-paginacion.mjs

      # El verificador de despliegue (scripts/verificar-despliegue.ps1) valida la
      # instalación post-release en el equipo del cliente. Aquí se prueba con su modo
      # -DryRun: ejecuta los chequeos y el veredicto reales contra un ambiente simulado
      # en %TEMP% (sin instalar nada) — el caso OK debe salir con exit 0 y, con
      # -SimularFallo, el camino de FALLOS debe salir con exit 1. Se usa el shell
      # powershell (5.1), el objetivo real del script.
      - name: Verificador de despliegue (-DryRun)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\verificar-despliegue.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw "El caso OK (-DryRun) debio salir con exit 0, obtuvo $LASTEXITCODE" }
          powershell -ExecutionPolicy Bypass -File scripts\verificar-despliegue.ps1 -DryRun -SimularFallo
          if ($LASTEXITCODE -ne 1) { throw "-SimularFallo debio salir con exit 1 (camino FALLOS), obtuvo $LASTEXITCODE" }
          Write-Host "Verificador de despliegue: OK (exit 0) y FALLOS (exit 1) validados"
          # Sin el exit 0 explícito el paso falla: el wrapper `shell: powershell` de GitHub
          # termina con `exit $LASTEXITCODE`, y tras -SimularFallo (exit 1) el paso saldría
          # con exit 1 aunque ambos casos hayan validado.
          exit 0

  # Smoke E2E del flujo de cobro real contra la app en dev (tauri dev + WebView2),
  # con BD aislada y vacía sembrada por seed_ci. Es el gate E2E del guardrail:
  # el smoke falla si [devGuard] emite cualquier aviso de contrato IPC (payload
  # mal tipado) en los flujos reales, y valida la regresión del incidente
  # extender_renta de punta a punta (extensión decimal con asserts de totales
  # sin doble cobro). Requiere WebView2 Runtime, preinstalado en los runners
  # de Windows. Ver Handsoff.md §6.4.
  smoke-e2e:
    name: Smoke E2E (gate del guardrail)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24 (mismo runtime que validate): el orquestador usa
      # import.meta.dirname y el smoke corre sobre node + npm del runner.
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # CRÍTICO: Defender debe excluirse ANTES de que Swatinem restaure la cache.
      # Si se excluye después, Defender escanea y bloquea .cargo-build-lock durante
      # la extracción del tar; el lock queda activo cuando cargo intenta abrirlo →
      # "Access is denied" (os error 5). Swatinem necesita el toolchain ya instalado
      # para calcular la cache key, por eso este paso va entre Setup Rust y Cache Cargo.
      - name: Excluir el workspace de Windows Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\src-tauri\target"
          Add-MpPreference -ExclusionProcess node.exe
          Add-MpPreference -ExclusionProcess cargo.exe
          Add-MpPreference -ExclusionProcess rustc.exe
          Add-MpPreference -ExclusionProcess tauri.exe

      # Swatinem scopea la cache por job: la primera corrida de este job
      # compila los deps debug (~3-4 min) y las siguientes los reutilizan.
      # La exclusión de Defender ya está activa: los archivos del tar se
      # extraen sin ser escaneados → sin race con .cargo-build-lock.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      # Belt-and-suspenders: elimina el .cargo-build-lock stale si Swatinem lo
      # restauró (aunque ahora no debería estar bloqueado por Defender).
      # Cubre debug y release por si el validate job lo dejó en cualquiera.
      - name: Limpiar cargo-build-lock stale si existe
        shell: pwsh
        run: |
          Remove-Item -Force "src-tauri\target\debug\.cargo-build-lock" -ErrorAction SilentlyContinue
          Remove-Item -Force "src-tauri\target\release\.cargo-build-lock" -ErrorAction SilentlyContinue

      # Orquesta: cargo build + vite ELEVADOS; el humo (seed_ci + app) vía
      # runas /trustlevel:0x20000 con ACLs endurecidas (icacls grant
      # Everyone sobre data_dir y resources/firebird: el token restringido
      # necesita esa ACE para mapear la memoria compartida de Firebird, y
      # WebView2 solo honra la bandera CDP con integridad media) → smoke
      # completo → limpieza.
      - name: Smoke E2E del flujo de cobro (smoke:dev)
        run: npm run smoke:dev

      # Artefactos del smoke en corridas EXITOSAS: los PDFs reales de orden
      # y contrato generados por el flujo de cobro, más las capturas de los
      # modales (Page.printToPDF sobre el pipeline de impresión real).
      # Retención corta: son evidencia, no diagnóstico (eso va en el paso
      # siguiente, con 7 días).
      - name: Subir artefactos del smoke (PDFs y capturas, solo en éxito)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artefactos
          path: .tmp-print/
          retention-days: 3

      - name: Subir capturas de diagnóstico (solo en fallo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostico
          path: .tmp-print/
          retention-days: 7
