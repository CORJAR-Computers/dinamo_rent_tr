name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build + Publicar release ${{ github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Build y publicar release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Dinamo Rent ERP ${{ github.ref_name }}'
          releaseBody: |
            Release generado automáticamente por GitHub Actions.

            ## Instalación
            - **Windows**: descarga el instalador NSIS `*-setup.exe` o el MSI `*.msi` de los assets de este release.
            - La app crea su `config.ini` en `%APPDATA%\com.corjar.dinamorent\` en el primer arranque.
            - Requiere WebView2 Runtime (se instala automáticamente si no está presente).

            Ver `SECURITY.md` para la política de manejo de secretos y respaldo de la clave PII.
          releaseDraft: false
          prerelease: false
